<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School · Wessel Smit</title>
  <meta name="description" content="Theorietoets oefenmodule Sprint 1 & 2.">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230a0f1e'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='%2300ff88' font-family='monospace' font-weight='bold'>&gt;_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --panel: rgba(16, 24, 44, 0.72);
      --border: rgba(0, 212, 255, 0.16);
      --text: #d6e2f5;
      --muted: #7a8aa8;
      --green: #00ff88;
      --cyan: #00d4ff;
      --radius: 12px;
      --font: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--green); color: var(--bg); }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.022) 0px,
        rgba(255, 255, 255, 0.022) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .nav {
      position: relative;
      z-index: 2;
      background: rgba(10, 15, 30, 0.78);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-inner a { text-decoration: none; color: inherit; }
    .user { color: var(--green); }
    .path { color: var(--cyan); }

    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .terminal {
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(0, 255, 136, 0.06);
      animation: fade-in 0.6s ease both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.55rem 0.8rem;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
    }

    .terminal-bar span { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-bar span:nth-child(1) { background: #ff5f57; }
    .terminal-bar span:nth-child(2) { background: #febc2e; }
    .terminal-bar span:nth-child(3) { background: #28c840; }

    .terminal-bar em {
      margin-left: auto;
      font-style: normal;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .terminal-body { padding: 1.5rem 1.25rem; }

    .terminal-body .line { font-size: 0.85rem; color: var(--muted); }
    .terminal-body .line + .line { margin-top: 0.3rem; }
    .prompt { color: var(--green); }
    .ok { color: var(--green); }

    h1 {
      margin: 1.5rem 0 0.5rem;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .sub { color: var(--muted); font-size: 0.85rem; }

    .loader {
      margin-top: 1.5rem;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .loader::after {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--green), var(--cyan));
      box-shadow: 0 0 12px var(--green);
      animation: load 1.6s ease-in-out infinite;
    }

    @keyframes load {
      from { transform: translateX(-100%); }
      to { transform: translateX(300%); }
    }

    .caret {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--green);
      vertical-align: -0.12em;
      margin-left: 0.2em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--green);
      color: var(--green);
      transition: box-shadow 0.25s, background 0.25s, transform 0.25s;
    }

    .btn:hover, .btn:focus-visible {
      background: rgba(0, 255, 136, 0.08);
      box-shadow: 0 0 24px rgba(0, 255, 136, 0.45);
      transform: translateY(-2px);
      outline: none;
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 1.5rem 1rem;
      border-top: 1px solid var(--border);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="nav">
    <nav class="nav-inner" aria-label="Navigatie">
      <a href="../index.html"><span class="user">wessel</span>@smit:<span class="path">~/school</span>$<span class="caret"></span></a>
    </nav>
  </header>

  <main>
    <div class="terminal">
      <div class="terminal-bar"><span></span><span></span><span></span><em>~/school/quiz.sh</em></div>
      <div class="terminal-body">
        <p class="line"><span class="prompt">$</span> ./quiz.sh --sprint 1,2</p>
        <p class="line"><span class="ok">[ok]</span> module gevonden: theorietoets</p>
        <p class="line"><span class="ok">[..]</span> vragen laden</p>

        <h1>Quiz module wordt hier geladen</h1>
        <p class="sub">Theorietoets oefenmodule Sprint 1 &amp; 2</p>

        <div class="loader" role="progressbar" aria-label="Bezig met laden"></div>

        <a href="../index.html" class="btn">← terug naar home</a>
      </div>
    </div>
  </main>

  <footer>Built by Wessel Smit · 2026</footer>
</body>
</html>
